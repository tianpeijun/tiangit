<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS CDK 系统架构图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* 核心样式 */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 桌面版布局 */
    .desktop-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    /* 图表容器 */
    .chart-container {
      width: 100%; 
      height: 700px;
    }
    
    /* 图例区域 */
    .legend-section {
      display: flex; 
      flex-wrap: wrap;
      gap: 20px; 
      padding: 20px; 
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      justify-content: center;
    }
    
    .legend-item {
      display: flex; 
      align-items: center;
      gap: 8px; 
      font-size: 14px;
    }
    
    .legend-dot {
      width: 14px; 
      height: 14px;
      border-radius: 50%;
    }
    
    /* 响应式调整 */
    @media (max-width: 768px) {
      .chart-container {
        height: 500px;
      }
      
      .legend-section {
        gap: 12px;
        padding: 15px;
      }
      
      .legend-item {
        font-size: 12px;
        gap: 6px;
      }
      
      .legend-dot {
        width: 12px;
        height: 12px;
      }
    }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
  <div class="desktop-container">
    <!-- 标题栏 -->
    <header class="bg-white rounded-t-lg shadow-sm">
      <div class="py-6 px-4 md:px-8 text-center border-b">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800">AWS CDK 系统架构图</h1>
        <p class="text-gray-600 mt-2">Awsome Shop 电商系统 AWS 架构设计</p>
      </div>
    </header>
    
    <!-- 内容区 -->
    <main class="p-4 md:p-6">
      <div id="architecture-chart" class="chart-container"></div>
    </main>
    
    <!-- 图例说明 -->
    <footer>
      <div class="legend-section">
        <div class="legend-item">
          <span class="legend-dot bg-blue-500"></span>
          <span>前端组件 (S3, CloudFront)</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot bg-green-500"></span>
          <span>后端组件 (EC2, FastAPI)</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot bg-gray-400"></span>
          <span>网络组件 (VPC, IGW, ALB)</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot bg-orange-400"></span>
          <span>存储组件 (S3 存储桶)</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot bg-purple-500"></span>
          <span>监控组件 (CloudWatch)</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot bg-teal-400"></span>
          <span>安全组件 (IAM Role, Security Group)</span>
        </div>
      </div>
    </footer>
  </div>
  
  <script>
    // 页面加载完成后初始化ECharts
    window.onload = function() {
      const chartDom = document.getElementById('architecture-chart');
      const myChart = echarts.init(chartDom);
      
      // 响应式调整图表大小
      window.addEventListener('resize', function() {
        myChart.resize();
      });
      
      const option = {
        backgroundColor: '#fafafa',
        tooltip: {
          formatter: '{b}',
          textStyle: {
            fontSize: 14
          }
        },
        series: [{
          type: 'graph',
          layout: 'none',
          symbolSize: 50,
          label: {
            show: true,
            position: 'bottom',
            fontSize: 13,
            fontWeight: 'bold',
            color: '#374151'
          },
          edgeLabel: {
            show: false,
            position: 'middle',
            fontSize: 11
          },
          edgeSymbol: ['circle', 'arrow'],
          edgeSymbolSize: [0, 8],
          roam: true,
          draggable: true,
          data: [
            { 
              id: 'cf1', name: 'CloudFront\n(管理端)',
              x: 300, y: 250,
              symbol: 'rect', symbolSize: [100, 70],
              itemStyle: { color: '#3b82f6' }
            },
            { 
              id: 'cf2', name: 'CloudFront\n(员工端)',
              x: 300, y: 450,
              symbol: 'rect', symbolSize: [100, 70],
              itemStyle: { color: '#3b82f6' }
            },
            { 
              id: 's3_1', name: 'S3\n(管理端)',
              x: 550, y: 250,
              symbol: 'rect', symbolSize: [100, 70],
              itemStyle: { color: '#f97316' }
            },
            { 
              id: 's3_2', name: 'S3\n(员工端)',
              x: 550, y: 450,
              symbol: 'rect', symbolSize: [100, 70],
              itemStyle: { color: '#f97316' }
            },
            { 
              id: 'alb', name: 'Application\nLoad Balancer',
              x: 800, y: 350,
              symbol: 'diamond', symbolSize: [120, 80],
              itemStyle: { color: '#9ca3af' },
              label: { position: 'bottom' }
            },
            {
              id: 'vpc', name: 'VPC 边界',
              x: 850, y: 350,
              symbol: 'roundRect', symbolSize: [700, 500],
              itemStyle: { 
                color: 'rgba(156, 163, 175, 0.05)',
                borderColor: '#4b5563',
                borderWidth: 2,
                borderType: 'dashed'
              },
              label: {
                position: 'top',
                offset: [0, -260],
                fontSize: 16,
                fontWeight: 'bold'
              }
            },
            {
              id: 'az1', name: '可用区 1',
              x: 750, y: 250,
              symbol: 'roundRect', symbolSize: [280, 200],
              itemStyle: { 
                color: 'rgba(107, 114, 128, 0.05)',
                borderColor: '#374151',
                borderWidth: 1
              }
            },
            {
              id: 'az2', name: '可用区 2',
              x: 950, y: 450,
              symbol: 'roundRect', symbolSize: [280, 200],
              itemStyle: { 
                color: 'rgba(107, 114, 128, 0.05)',
                borderColor: '#374151',
                borderWidth: 1
              }
            },
            { 
              id: 'ec2_1', name: 'EC2\n实例 (AZ1)',
              x: 750, y: 250,
              symbol: 'circle',
              symbolSize: 60,
              itemStyle: { color: '#22c55e' }
            },
            { 
              id: 'ec2_2', name: 'EC2\n实例 (AZ2)',
              x: 950, y: 450,
              symbol: 'circle',
              symbolSize: 60,
              itemStyle: { color: '#22c55e' }
            },
            { 
              id: 'igw', name: 'Internet\nGateway',
              x: 100, y: 350,
              symbol: 'roundRect', symbolSize: [80, 80],
              itemStyle: { color: '#6b7280' }
            },
            { 
              id: 'sg', name: 'Security\nGroup',
              x: 850, y: 350,
              symbol: 'rect', symbolSize: [150, 80],
              itemStyle: { color: 'rgba(45, 212, 191, 0.2)', borderColor: '#0d9488', borderWidth: 1 }
            },
            { 
              id: 'cw', name: 'CloudWatch\nLogs',
              x: 850, y: 100,
              symbol: 'rect', symbolSize: [120, 70],
              itemStyle: { color: '#a855f7' },
              label: { position: 'top' }
            },
            { 
              id: 'iam', name: 'IAM Role',
              x: 1100, y: 600,
              symbol: 'rect', symbolSize: [160, 70],
              itemStyle: { color: '#0d9488' },
              label: { position: 'top' }
            }
          ],
          links: [
            { source: 'igw', target: 'cf1', lineStyle: { width: 2 } },
            { source: 'igw', target: 'cf2', lineStyle: { width: 2 } },
            { source: 'cf1', target: 's3_1', lineStyle: { width: 2 } },
            { source: 'cf2', target: 's3_2', lineStyle: { width: 2 } },
            { source: 's3_1', target: 'alb', lineStyle: { width: 2 } },
            { source: 's3_2', target: 'alb', lineStyle: { width: 2 } },
            { source: 'alb', target: 'ec2_1', lineStyle: { color: '#4b5563', width: 3 } },
            { source: 'alb', target: 'ec2_2', lineStyle: { color: '#4b5563', width: 3 } },
            { source: 'ec2_1', target: 'cw', lineStyle: { type: 'dashed', color: '#a855f7', width: 1.5 } },
            { source: 'ec2_2', target: 'cw', lineStyle: { type: 'dashed', color: '#a855f7', width: 1.5 } },
            { source: 'iam', target: 'ec2_1', lineStyle: { width: 1.5 } },
            { source: 'iam', target: 'ec2_2', lineStyle: { width: 1.5 } },
            { source: 'sg', target: 'ec2_1', lineStyle: { width: 1.5 } },
            { source: 'sg', target: 'ec2_2', lineStyle: { width: 1.5 } }
          ],
          lineStyle: {
            color: '#6b7280',
            width: 2,
            curveness: 0.1
          }
        }]
      };
      
      myChart.setOption(option);
      
      // 添加点击事件
      myChart.on('click', function(params) {
        console.log('Clicked:', params);
      });
    }
  </script>
</body>
</html>
