openapi: 3.0.3
info:
  title: AWSomeShop API
  description: |
    AWSomeShop 员工福利电商平台 API 文档
    
    ## 认证方式
    系统使用 Session-based 认证。登录成功后，服务器会返回 Session ID，客户端需要在后续请求中携带该 Session ID。
    
    ## 统一响应格式
    所有 API 响应都遵循统一的 JSON 格式：
    
    **成功响应：**
    ```json
    {
      "code": 200,
      "message": "success",
      "data": { ... }
    }
    ```
    
    **错误响应：**
    ```json
    {
      "code": 400,
      "message": "错误描述",
      "data": null
    }
    ```
    
    ## 分页格式
    列表接口支持分页，响应格式：
    ```json
    {
      "code": 200,
      "message": "success",
      "data": {
        "items": [],
        "total": 100,
        "page": 1,
        "page_size": 20,
        "total_pages": 5
      }
    }
    ```
  version: 1.0.0
  contact:
    name: AWSomeShop Team
    email: support@awsomeshop.com

servers:
  - url: http://localhost:8000
    description: 本地开发环境
  - url: https://api.awsomeshop.com
    description: 生产环境

tags:
  - name: 认证
    description: 用户认证相关接口
  - name: 员工端-产品
    description: 员工端产品浏览相关接口
  - name: 员工端-购物车
    description: 员工端购物车管理接口
  - name: 员工端-订单
    description: 员工端订单管理接口
  - name: 员工端-积分
    description: 员工端积分查询接口
  - name: 员工端-个人中心
    description: 员工端个人信息管理接口
  - name: 管理端-用户管理
    description: 管理端用户管理接口
  - name: 管理端-产品管理
    description: 管理端产品管理接口
  - name: 管理端-分类管理
    description: 管理端分类管理接口
  - name: 管理端-积分管理
    description: 管理端积分发放接口
  - name: 管理端-操作日志
    description: 管理端操作日志查询接口

paths:
  # ==================== 认证接口 ====================
  /api/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 员工或管理员使用用户名和密码登录系统
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: 用户名
                  example: "employee001"
                password:
                  type: string
                  format: password
                  description: 密码（6-8位，包含数字和字母）
                  example: "test123456"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session_id:
                            type: string
                            description: Session ID
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags:
        - 认证
      summary: 用户登出
      description: 用户退出登录，清除 Session
      operationId: logout
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/current-user:
    get:
      tags:
        - 认证
      summary: 获取当前用户信息
      description: 获取当前登录用户的详细信息
      operationId: getCurrentUser
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/password/change:
    post:
      tags:
        - 认证
      summary: 员工修改密码
      description: 员工修改自己的登录密码
      operationId: changePassword
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                  description: 当前密码
                new_password:
                  type: string
                  format: password
                  description: 新密码（6-8位，包含数字和字母）
                  minLength: 6
                  maxLength: 8
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 员工端-产品接口 ====================
  /api/personal/products:
    get:
      tags:
        - 员工端-产品
      summary: 获取产品列表
      description: 获取已上架的产品列表，支持分页、排序和筛选
      operationId: getProducts
      security:
        - SessionAuth: []
      parameters:
        - name: page
          in: query
          description: 页码（从1开始）
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: 每页数量
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort_by
          in: query
          description: 排序字段
          schema:
            type: string
            enum: [points_asc, created_desc]
            default: created_desc
        - name: category_ids
          in: query
          description: 分类ID列表（逗号分隔）
          schema:
            type: string
            example: "1,2,3"
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Product'
                          total:
                            type: integer
                          page:
                            type: integer
                          page_size:
                            type: integer
                          total_pages:
                            type: integer
                          user_points:
                            type: integer
                            description: 当前用户积分余额
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/products/{id}:
    get:
      tags:
        - 员工端-产品
      summary: 获取产品详情
      description: 获取指定产品的详细信息
      operationId: getProductDetail
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 产品ID
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/products/search:
    get:
      tags:
        - 员工端-产品
      summary: 搜索产品
      description: 按产品名称模糊搜索
      operationId: searchProducts
      security:
        - SessionAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          description: 搜索关键词
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 搜索成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedProducts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/personal/categories:
    get:
      tags:
        - 员工端-产品
      summary: 获取分类树
      description: 获取完整的产品分类树（一级和二级分类）
      operationId: getCategories
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryTree'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 员工端-购物车接口 ====================
  /api/personal/cart:
    get:
      tags:
        - 员工端-购物车
      summary: 获取购物车
      description: 获取当前用户的购物车商品列表
      operationId: getCart
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/CartItem'
                          total_quantity:
                            type: integer
                            description: 总商品数量
                          total_points:
                            type: integer
                            description: 总所需积分
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/cart/add:
    post:
      tags:
        - 员工端-购物车
      summary: 添加到购物车
      description: 添加产品到购物车，如果已存在则增加数量
      operationId: addToCart
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: integer
                  description: 产品ID
                quantity:
                  type: integer
                  description: 数量
                  minimum: 1
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/cart/update:
    put:
      tags:
        - 员工端-购物车
      summary: 更新购物车商品数量
      description: 修改购物车中指定商品的数量
      operationId: updateCartItem
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/cart/remove/{product_id}:
    delete:
      tags:
        - 员工端-购物车
      summary: 删除购物车商品
      description: 从购物车中删除指定商品
      operationId: removeFromCart
      security:
        - SessionAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          description: 产品ID
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/cart/clear:
    delete:
      tags:
        - 员工端-购物车
      summary: 清空购物车
      description: 清空当前用户的购物车
      operationId: clearCart
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 清空成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 员工端-订单接口 ====================
  /api/personal/orders/create:
    post:
      tags:
        - 员工端-订单
      summary: 创建订单
      description: 从购物车创建订单，扣除积分并清空购物车
      operationId: createOrder
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipping_address
                - shipping_phone
              properties:
                shipping_address:
                  type: string
                  description: 收货地址
                  maxLength: 500
                shipping_phone:
                  type: string
                  description: 联系电话
                  maxLength: 20
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/personal/orders:
    get:
      tags:
        - 员工端-订单
      summary: 获取订单列表
      description: 获取当前用户的订单历史
      operationId: getOrders
      security:
        - SessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedOrders'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/orders/{id}:
    get:
      tags:
        - 员工端-订单
      summary: 获取订单详情
      description: 获取指定订单的详细信息
      operationId: getOrderDetail
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 订单ID
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 员工端-积分接口 ====================
  /api/personal/points/balance:
    get:
      tags:
        - 员工端-积分
      summary: 获取积分余额
      description: 获取当前用户的积分余额
      operationId: getPointsBalance
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          balance:
                            type: integer
                            description: 积分余额
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/points/transactions:
    get:
      tags:
        - 员工端-积分
      summary: 获取积分明细
      description: 获取当前用户的积分交易明细
      operationId: getPointsTransactions
      security:
        - SessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedTransactions'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 员工端-个人中心接口 ====================
  /api/personal/profile:
    get:
      tags:
        - 员工端-个人中心
      summary: 获取个人信息
      description: 获取当前用户的个人信息
      operationId: getProfile
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/personal/address:
    get:
      tags:
        - 员工端-个人中心
      summary: 获取收货地址
      description: 获取当前用户的收货地址信息
      operationId: getAddress
      security:
        - SessionAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - 员工端-个人中心
      summary: 更新收货地址
      description: 更新当前用户的收货地址信息
      operationId: updateAddress
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
                - phone
              properties:
                address:
                  type: string
                  maxLength: 500
                phone:
                  type: string
                  maxLength: 20
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 管理端-用户管理接口 ====================
  /api/manage/users:
    get:
      tags:
        - 管理端-用户管理
      summary: 获取用户列表
      description: 获取所有用户列表（仅管理员）
      operationId: getUsers
      security:
        - SessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 搜索关键词（用户名、姓名、工号）
          schema:
            type: string
        - name: role
          in: query
          description: 角色筛选
          schema:
            type: string
            enum: [employee, admin]
        - name: is_active
          in: query
          description: 状态筛选
          schema:
            type: boolean
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - 管理端-用户管理
      summary: 创建用户
      description: 创建新用户账户（仅管理员）
      operationId: createUser
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/manage/users/{id}:
    get:
      tags:
        - 管理端-用户管理
      summary: 获取用户详情
      description: 获取指定用户的详细信息（仅管理员）
      operationId: getUserDetail
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - 管理端-用户管理
      summary: 更新用户信息
      description: 更新用户信息（仅管理员）
      operationId: updateUser
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
