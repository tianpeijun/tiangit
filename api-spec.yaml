          nullable: true
        points_required:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
          default: inactive
        category_ids:
          type: array
          items:
            type: integer
          description: 分类ID列表

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        points_required:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
        category_ids:
          type: array
          items:
            type: integer

