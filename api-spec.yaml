components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: header
      name: X-Session-ID
      description: Session ID 从登录接口获取

  schemas:
    # ==================== 通用响应 ====================
    ApiResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 响应码
          example: 200
        message:
          type: string
          description: 响应消息
          example: "success"
        data:
          description: 响应数据
          nullable: true

    # ==================== 用户相关 ====================
    User:
      type: object
      properties:
        id:
          type: integer
          description: 用户ID
        username:
          type: string
          description: 用户名
        real_name:
          type: string
          description: 真实姓名
        employee_id:
          type: string
          description: 工号
        department:
          type: string
          description: 部门
        position:
          type: string
          description: 职位
          nullable: true
        role:
          type: string
          enum: [employee, admin]
          description: 角色
        points:
          type: integer
          description: 积分余额
        is_active:
          type: boolean
          description: 账户状态
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        last_login_at:
          type: string
          format: date-time
          description: 最后登录时间
          nullable: true

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - real_name
        - employee_id
        - department
        - role
      properties:
        username:
          type: string
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 8
        real_name:
          type: string
          maxLength: 100
        employee_id:
          type: string
          maxLength: 50
        department:
          type: string
          maxLength: 100
        position:
          type: string
          maxLength: 100
          nullable: true
        role:
          type: string
          enum: [employee, admin]
          default: employee

    UpdateUserRequest:
      type: object
      properties:
        real_name:
          type: string
          maxLength: 100
        employee_id:
          type: string
          maxLength: 50
        department:
          type: string
          maxLength: 100
        position:
          type: string
          maxLength: 100
        is_active:
          type: boolean

    PaginatedUsers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer

    # ==================== 产品相关 ====================
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        points_required:
          type: integer
        status:
          type: string
          enum: [active, inactive]
        thumbnail_url:
          type: string
          description: 缩略图URL
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            images:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'
            categories:
              type: array
              items:
                $ref: '#/components/schemas/Category'

    ProductImage:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        original_filename:
          type: string
        image_url:
          type: string
          description: 原图URL
        thumbnail_url:
          type: string
          description: 缩略图URL
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateProductRequest:
